<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CutMaster - Entraînement Oral</title>
    <link rel="stylesheet" href="shadowing.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="index.html" class="back-link">← Retour à l'accueil</a>
            <h1>🗣️ CutMaster</h1>
            <p class="subtitle">Entraînez-vous à prononcer l'anglais avec un alignement audio parfait !</p>
        </header>
        
        <div class="card setup-card" id="setupCard">
            <!-- Tabs: Library vs Custom -->
            <div class="source-tabs">
                <button class="tab-btn active" id="tabLibrary" data-source="library">📚 Bibliothèque CC-INP (134 textes)</button>
                <button class="tab-btn" id="tabCustom" data-source="custom">📁 Importer mes fichiers</button>
            </div>

            <!-- Library View -->
            <div id="librarySection" class="section-pane">
                <div class="search-row">
                    <input type="text" id="librarySearch" placeholder="🔍 Rechercher par titre ou numéro (ex: AI, climate, 42)..." class="search-input">
                </div>

                <div class="form-group">
                    <label for="librarySelect">Sélectionnez votre leçon :</label>
                    <select id="librarySelect" class="styled-select">
                        <option value="">Chargement des leçons...</option>
                    </select>
                </div>

                <div class="preview-box" id="previewBox">
                    <div class="preview-header">
                        <span class="badge" id="previewNum">Texte 1</span>
                        <h4 id="previewTitle">10 CANCER-FIGHTING FOODS</h4>
                    </div>
                    <div class="preview-meta">
                        <span>⏱️ Durée : <strong id="previewDuration">3m 29s</strong></span>
                        <span>📝 <strong id="previewWords">459</strong> mots</span>
                        <span>🎓 Annales Anglais</span>
                    </div>
                </div>

                <button id="startLibraryBtn" class="primary-btn">🚀 Charger et Commencer l'entraînement</button>
            </div>

            <!-- Custom File Upload View -->
            <div id="customSection" class="section-pane hidden">
                <div class="form-group">
                    <label for="audioInput">Fichier Audio (.mp3)</label>
                    <input type="file" id="audioInput" accept="audio/*">
                </div>
                <div class="form-group">
                    <label for="jsonInput">Fichier de Synchronisation (.json)</label>
                    <input type="file" id="jsonInput" accept="application/json">
                </div>
                <button id="loadBtn" class="primary-btn">Commencer l'entraînement</button>
            </div>
        </div>

        <div class="card player-card hidden" id="playerCard">
            <div class="active-banner" id="activeBanner">
                <div class="active-info">
                    <span class="active-badge" id="activeNum">Texte 1</span>
                    <span class="active-title" id="activeTitle">10 CANCER-FIGHTING FOODS</span>
                </div>
                <div class="active-actions">
                    <button class="nav-btn" id="prevLessonBtn" title="Texte précédent">⬅️ Précédent</button>
                    <button class="nav-btn" id="nextLessonBtn" title="Texte suivant">Suivant ➡️</button>
                    <button class="nav-btn btn-change" id="changeLessonBtn" title="Changer de leçon">📋 Liste</button>
                </div>
            </div>

            <div class="controls-bar">
                <button id="playPauseBtn" class="play-btn">▶️ Lancer</button>
                
                <div class="settings-bar">
                    <div class="granularity-controls">
                        <button class="gran-btn active" data-val="sentence">Phrases</button>
                        <button class="gran-btn" data-val="comma">Virgules</button>
                        <button class="gran-btn" data-val="word">Mots</button>
                    </div>
                    
                    <div class="pause-settings">
                        <label for="pauseMult">Pause: x<span id="pauseVal">1.5</span></label>
                        <input type="range" id="pauseMult" min="0.5" max="4.0" step="0.1" value="1.5">
                    </div>
                    
                    <div class="mode-toggle">
                        <label for="autoPauseToggle">Auto-Pause</label>
                        <input type="checkbox" id="autoPauseToggle" checked>
                    </div>
                </div>
            </div>
            
            <div class="status-indicator" id="statusIndicator">
                <div id="statusText">En attente...</div>
                <div class="progress-bar-container hidden" id="progressBarContainer">
                    <div class="progress-bar-fill" id="progressBarFill"></div>
                </div>
            </div>

            <div class="text-container" id="textContainer">
                <!-- Les phrases seront injectées ici -->
            </div>
            
            <audio id="audioPlayer" class="hidden"></audio>
        </div>
    </div>
    
    <script src="shadowing.js"></script>
</body>
</html>
