<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CutMaster - Éditeur Audio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">CutMaster</div>
            
            <div class="mode-toggle">
                <button class="mode-btn active" data-target="panel-decoupage">Découpage</button>
                <button class="mode-btn" data-target="panel-shadowing">Shadowing</button>
            </div>
            
            <a href="index.html" class="back-link">← Accueil</a>
        </header>

        <main>
            <!-- PANEL: DECOUPAGE -->
            <section id="panel-decoupage" class="panel active">
                <div class="drop-zone" id="decoupage-drop-zone">
                    <input type="file" id="decoupage-file" accept="audio/*,video/mp4" hidden>
                    <p>Glissez un fichier audio ici</p>
                    <button type="button" class="btn-secondary btn-small" id="decoupage-browse">Parcourir</button>
                    <p class="file-name" id="decoupage-file-name"></p>
                </div>

                <div class="parameters-row">
                    <div class="param-group">
                        <label for="min-silence">Silence minimum (ms)</label>
                        <input type="number" id="min-silence" value="700">
                    </div>
                    <div class="param-group">
                        <label for="thresh-db">Seuil relatif (dB)</label>
                        <input type="number" id="thresh-db" value="-16">
                    </div>
                    <div class="param-group">
                        <label for="pause-mult">Multiplicateur de pause</label>
                        <input type="number" id="pause-mult" value="1.0" step="0.1">
                    </div>
                    <div class="param-group">
                        <label for="export-format">Format d'export</label>
                        <select id="export-format">
                            <option value="wav">.WAV</option>
                            <option value="mp3">.MP3</option>
                        </select>
                    </div>
                </div>

                <button class="btn-primary full-width" id="decoupage-process">Lancer le traitement</button>
                
                <div class="status-area" id="decoupage-status"></div>

                <div class="result-area hidden" id="decoupage-result">
                    <div class="waveform-card">
                        <div id="waveform"></div>
                    </div>
                    <div class="result-controls">
                        <button class="btn-secondary" id="decoupage-play">Play / Pause</button>
                        <button class="btn-success full-width" id="decoupage-download">Télécharger</button>
                    </div>
                </div>
            </section>

            <!-- PANEL: SHADOWING -->
            <section id="panel-shadowing" class="panel">
                <!-- SOURCE SELECTION TABS -->
                <div class="shadowing-source-tabs" id="shadowing-source-tabs">
                    <button class="source-tab active" id="tab-library" data-source="library">
                        <span>📚</span> Bibliothèque CC-INP (134 textes)
                    </button>
                    <button class="source-tab" id="tab-custom" data-source="custom">
                        <span>📁</span> Importer mes fichiers
                    </button>
                </div>

                <!-- SOURCE: BIBLIOTHÈQUE OFFICIELLE -->
                <div class="source-container" id="source-library">
                    <div class="library-search-row">
                        <div class="search-input-wrap">
                            <span class="search-icon">🔍</span>
                            <input type="text" id="library-search" placeholder="Rechercher par titre ou numéro (ex: AI, climate, 42)..." autocomplete="off">
                            <button id="clear-search" class="clear-search hidden" title="Effacer la recherche">&times;</button>
                        </div>
                    </div>

                    <div class="library-select-group">
                        <label for="library-select">Choisir une leçon :</label>
                        <select id="library-select" class="library-select">
                            <option value="">Chargement des textes...</option>
                        </select>
                    </div>

                    <div class="lesson-preview-card" id="lesson-preview-card">
                        <div class="preview-header">
                            <span class="preview-badge" id="preview-lesson-num">Texte 1</span>
                            <h3 class="preview-title" id="preview-lesson-title">10 CANCER-FIGHTING FOODS</h3>
                        </div>
                        <div class="preview-meta">
                            <span class="meta-tag">⏱️ <span id="preview-lesson-duration">3m 29s</span></span>
                            <span class="meta-tag">📝 <span id="preview-lesson-words">459 mots</span></span>
                            <span class="meta-tag">🎓 Annales Anglais</span>
                        </div>
                        <button class="btn-primary full-width" id="library-start-btn">
                            🚀 Charger et Commencer l'entraînement
                        </button>
                    </div>
                </div>

                <!-- SOURCE: IMPORT MANUEL -->
                <div class="source-container hidden" id="source-custom">
                    <div class="upload-row">
                        <div class="upload-group">
                            <label for="shadowing-audio">Fichier Audio (.mp3)</label>
                            <input type="file" id="shadowing-audio" accept="audio/*">
                        </div>
                        <div class="upload-group">
                            <label for="shadowing-json">Fichier de Synchro (.json)</label>
                            <input type="file" id="shadowing-json" accept=".json,application/json">
                        </div>
                        <button class="btn-secondary align-bottom" id="shadowing-load">Charger</button>
                    </div>
                </div>

                <div class="shadowing-controls hidden" id="shadowing-controls-bar">
                    <div class="active-lesson-banner" id="active-lesson-banner">
                        <div class="active-lesson-info">
                            <span class="active-badge" id="active-lesson-num">Texte 1</span>
                            <span class="active-title" id="active-lesson-title">10 CANCER-FIGHTING FOODS</span>
                        </div>
                        <div class="active-lesson-actions">
                            <button class="btn-nav" id="prev-lesson-btn" title="Texte précédent">⬅️ Précédent</button>
                            <button class="btn-nav" id="next-lesson-btn" title="Texte suivant">Suivant ➡️</button>
                            <button class="btn-nav btn-outline" id="change-lesson-btn" title="Changer de texte">📋 Liste</button>
                        </div>
                    </div>

                    <div class="controls-action-row">
                        <button class="btn-primary" id="shadowing-play">Play</button>
                        
                        <div class="segment-control">
                            <button class="seg-btn active" data-granularity="sentence">Phrases</button>
                            <button class="seg-btn" data-granularity="comma">Virgules</button>
                            <button class="seg-btn" data-granularity="word">Mots</button>
                        </div>
                        
                        <div class="pause-control">
                            <label for="shadowing-pause-mult">Pause (x)</label>
                            <input type="range" id="shadowing-pause-mult" min="1" max="4" step="0.1" value="2">
                            <span id="shadowing-pause-val">2.0</span>
                        </div>

                        <div class="toggle-group">
                            <label for="auto-pause-toggle">Auto-pause</label>
                            <label class="switch">
                                <input type="checkbox" id="auto-pause-toggle" checked>
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="shadowing-status hidden" id="shadowing-status">
                    <span class="status-text" id="shadowing-status-text">Prêt</span>
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="shadowing-progress"></div>
                    </div>
                </div>

                <div class="text-display" id="shadowing-text"></div>

                <audio id="shadowing-audio-player" preload="auto" style="display:none;"></audio>
            </section>
        </main>
    </div>

    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
