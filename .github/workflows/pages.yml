name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Prepare audio library for deployment
        run: |
          rm -rf webapp/audio/cc-inp
          mkdir -p webapp/audio/cc-inp
          cp -r "Fichiers audio/cc-inp 2026 annales anglais/"* webapp/audio/cc-inp/
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the webapp directory containing app and audio files
          path: './webapp'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
